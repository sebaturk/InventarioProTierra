<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InventarioPro</title>
<meta name="description" content="Control de stock por área, con conteo mensual y aprobación de diferencias.">
<meta name="theme-color" content="#35524F">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app"></div>

<!-- Lógica de negocio: pantallas, login por PIN, conteos, aprobaciones.
     Se carga como script clásico para que sus funciones queden accesibles
     desde los onclick="..." que arma dinámicamente. -->
<script src="js/app.js"></script>

<!-- Conexión con Firebase (Firestore + Auth anónima). -->
<script type="module" src="js/firebase-adapter.js"></script>

<!-- Arranca la app una vez que Firebase está listo. -->
<script type="module">
  // Espera a que firebase-adapter.js haya corrido y dejado window.__firebaseReady listo.
  // Como ambos son scripts type="module", el navegador los ejecuta en orden después
  // de parsear el HTML, así que para cuando llega acá ya existe.
  init();
</script>
</body>
</html>
